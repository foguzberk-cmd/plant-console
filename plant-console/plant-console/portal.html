<style>
:root{--brand:#9E2B25;--brand-dark:#7d211c;--ink:#1a1e23;--muted:#5e6772;--line:#dde1e5;--bg:#eef0f2;--panel:#fff;--ok:#2f7d4e;--warn:#a86a12;--err:#b3261e;
  --sans:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--cond:"Barlow Semi Condensed","Barlow",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
input{font:inherit;font-size:16px}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:400px}
.logo{display:block;max-width:220px;width:70%;margin:0 auto 14px}
h1{font-family:var(--cond);font-weight:700;font-size:24px;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 22px;font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
.field{width:100%;height:48px;border:1px solid var(--line);border-radius:9px;padding:0 14px;background:#fff;color:var(--ink)}
.field:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.code{letter-spacing:.4em;text-align:center;font-weight:700;font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;width:100%;margin-top:14px}
.btn-primary:hover{background:var(--brand-dark)}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 0}
.msg{margin-top:12px;font-size:13.5px;min-height:20px}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.fine{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
/* app */
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.hwrap{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hlogo{height:30px}
.hname{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname select{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%;background:#fff}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{color:var(--muted);font-size:13px;font-weight:600}
.stat .v{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.15;margin-top:2px}
.v.err{color:var(--err)}
.aging{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg);margin:10px 0 8px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;font-size:13px}
.legend b{display:block;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tabs{display:flex;gap:6px;margin:22px 0 10px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:#f7f8f9}
.row.head{cursor:default;background:#f5f6f8;font-size:12.5px;font-weight:600;color:var(--muted)}
.row.head:hover{background:#f5f6f8}
.num{text-align:right}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.over{background:#fdecea;color:var(--err)} .chip.open{background:#fff4e0;color:var(--warn)} .chip.paid{background:#e7f4ec;color:var(--ok)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;margin-top:16px;text-align:center}
#installBar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:14px}
#installBar img{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);flex:none}
#installBar .t{flex:1;font-size:13.5px} #installBar .t b{display:block;font-size:14.5px}
#installBar .x{background:none;border:0;font-size:20px;color:var(--muted);padding:4px 6px}
@media (max-width:640px){
  .row{grid-template-columns:1fr auto;grid-template-areas:"no bal" "dt st";row-gap:4px}
  .row.head{display:none}
  .row .c-no{grid-area:no;font-weight:700} .row .c-bal{grid-area:bal} .row .c-dt{grid-area:dt;color:var(--muted);font-size:13px} .row .c-st{grid-area:st;text-align:right}
  .row .c-total{display:none}
}
/* invoice sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){ #sheet{align-items:center} }
.sheet{background:var(--panel);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ .sheet{border-radius:14px} }
.sheet h2{font-family:var(--cond);font-size:22px;margin:0}
.meta{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 6px 0}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

  var r=await fetch('/portal/api/'+path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{}));
  var j={}; try{ j=await r.json(); }catch(e){}
  if(r.status===401 && j.error==='signed-out'){ showLogin(); throw new Error('signed-out'); }
  if(!r.ok) throw new Error(j.error||'Something went wrong. Please try again.');
  return j;
}
function post(path,body){ return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); }
function msg(t,kind){ var m=$('lMsg'); m.textContent=t||''; m.className='msg'+(kind?' '+kind:''); }
function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('fCode').classList.add('hidden'); $('fPhone').classList.remove('hidden'); setTimeout(function(){ $('phone').focus(); },50); }
var resendTimer=null;
function startResendCountdown(){
  var b=$('bResend'), n=30; b.disabled=true; clearInterval(resendTimer);
  b.textContent='Resend code ('+n+')';
  resendTimer=setInterval(function(){ n--; if(n<=0){ clearInterval(resendTimer); b.disabled=false; b.textContent='Resend code'; } else b.textContent='Resend code ('+n+')'; },1000);
}
async function sendCode(){
  var ph=$('phone').value.trim(); if(!ph) return;
  $('bSend').disabled=true; msg('Sending…');
  try{
    var j=await post('send-code',{phone:ph});
    state.phone=ph; $('toPhone').textContent=ph;
    $('fPhone').classList.add('hidden'); $('fCode').classList.remove('hidden'); $('code').value=''; $('code').focus();
    msg(j.message||'Code sent.','ok'); startResendCountdown();
  }catch(e){ msg(e.message,'err'); }
  $('bSend').disabled=false;
}
$('fPhone').addEventListener('submit',function(e){ e.preventDefault(); sendCode(); });
$('bResend').addEventListener('click',function(){ $('phone').value=state.phone; sendCode(); });
$('bBack').addEventListener('click',function(){ msg(''); $('fCode').classList.add('hidden'); $('fPhone').classList.remove('hidden'); $('phone').focus(); });
$('fCode').addEventListener('submit',async function(e){
  e.preventDefault(); var c=$('code').value.replace(/\D/g,''); if(c.length<4){ msg('Enter the code from the text message.','err'); return; }
  $('bVerify').disabled=true; msg('Checking…');
  try{ await post('verify',{phone:state.phone,code:c}); msg(''); await start(); showInstallBar(); }catch(e){ if(e.message!=='signed-out') msg(e.message,'err'); }
  $('bVerify').disabled=false;
});
$('code').addEventListener('input',function(){ if(this.value.replace(/\D/g,'').length===6) $('fCode').requestSubmit(); });
$('bOut').addEventListener('click',async function(){ try{ await post('logout'); }catch(e){} location.reload(); });
async function start(){
  var me=await api('me');
  state.customers=me.customers||[];
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  var keep=localStorage.getItem('portal_cust');
  state.cust=state.customers.find(function(c){ return c.id===keep; })||state.customers[0];
  renderName(); await load();
}
function renderName(){
  var el=$('custName');
  if(state.customers.length>1){
    el.innerHTML='<select id="custSel" aria-label="Choose account">'+state.customers.map(function(c){ return '<option value="'+esc(c.id)+'"'+(c.id===state.cust.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')+'</select>';
    $('custSel').addEventListener('change',function(){ state.cust=state.customers.find(function(c){ return c.id===$('custSel').value; }); try{ localStorage.setItem('portal_cust',state.cust.id); }catch(e){} load(); });
  } else el.textContent=state.cust?state.cust.name:'';
}
async function load(){
  $('loading').classList.remove('hidden'); $('content').classList.add('hidden');
  $('loading').innerHTML='<span class="spin"></span> Loading your account…';
  try{
    state.data=await api('summary?c='+encodeURIComponent(state.cust.id));
    render();
  }catch(e){ if(e.message!=='signed-out') $('loading').textContent=e.message; }
}
function chip(i){
  if(i.balance<=0.004) return '<span class="chip paid">Paid</span>';
  if(i.daysOverdue>0) return '<span class="chip over">'+i.daysOverdue+' day'+(i.daysOverdue!==1?'s':'')+' past due</span>';
  return '<span class="chip open">Due '+fmtDate(i.due)+'</span>';
}
function render(){
  var d=state.data;
  $('sBal').textContent=money(d.balance);
  $('sOver').textContent=money(d.overdue); $('sOver').className='v'+(d.overdue>0.004?' err':'');
  $('sCount').textContent=d.open.length;
  var segs=[['current','Not yet due','#2f7d4e'],['d1_30','1–30 days late','#d4a017'],['d31_60','31–60 days late','#d9822b'],['d61_90','61–90 days late','#c4512c'],['d90','Over 90 days late','#b3261e']];
  var tot=d.balance||0;
  $('agBar').innerHTML=tot>0?segs.map(function(s){ var v=d.aging[s[0]]||0; return v>0?'<span style="width:'+(v/tot*100)+'%;background:'+s[2]+'" title="'+esc(s[1])+': '+money(v)+'"></span>':''; }).join(''):'';
  $('agLegend').innerHTML=segs.map(function(s){ return '<div><span class="dot" style="background:'+s[2]+'"></span>'+esc(s[1])+'<b>'+money(d.aging[s[0]]||0)+'</b></div>'; }).join('');
  $('tOpen').textContent='Open invoices ('+d.open.length+')';
  renderList();
  $('asOf').textContent='Up to date as of '+new Date(d.asOf).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'. Questions about your account? Please contact Leader Meat Packing.';
  $('loading').classList.add('hidden'); $('content').classList.remove('hidden');
}
function renderList(){
  var rows=state.tab==='open'?state.data.open:state.data.recent;
  $('tOpen').setAttribute('aria-selected',state.tab==='open'); $('tRecent').setAttribute('aria-selected',state.tab!=='open');
  if(!rows.length){ $('list').innerHTML='<div class="empty">'+(state.tab==='open'?'No open invoices — you\'re all paid up. Thank you!':'No invoices in the last 4 months.')+'</div>'; return; }
  $('list').innerHTML='<div class="row head"><span>Invoice</span><span>Date</span><span class="num">Total</span><span class="num">Balance</span><span></span></div>'
    +rows.map(function(i){
      return '<button class="row" data-inv="'+esc(i.id)+'"><span class="c-no">#'+esc(i.number)+'</span><span class="c-dt">'+fmtDate(i.date)+'</span><span class="c-total num">'+money(i.total)+'</span><span class="c-bal num"><b>'+money(i.balance)+'</b></span><span class="c-st">'+chip(i)+'</span></button>';
    }).join('');
  [].forEach.call($('list').querySelectorAll('.row[data-inv]'),function(b){ b.addEventListener('click',function(){ openInvoice(b.getAttribute('data-inv')); }); });
}
$('tOpen').addEventListener('click',function(){ state.tab='open'; renderList(); });
$('tRecent').addEventListener('click',function(){ state.tab='recent'; renderList(); });
async function openInvoice(id){
  var sh=$('sheet'), body=$('sheetBody');
  sh.classList.remove('hidden'); body.innerHTML='<div class="empty"><span class="spin"></span> Loading invoice…</div>';
  try{
    var i=await api('invoice?c='+encodeURIComponent(state.cust.id)+'&inv='+encodeURIComponent(id));
    var pdf='/portal/api/invoice-pdf?c='+encodeURIComponent(state.cust.id)+'&inv='+encodeURIComponent(id);
    body.innerHTML='<h2>Invoice #'+esc(i.number)+'</h2>'
      +'<div class="meta">Date '+fmtDate(i.date)+' · Due '+fmtDate(i.due)+' · '+chip(i)+'</div>'
      +'<div style="overflow:auto"><table><thead><tr><th>Product</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead><tbody>'
      +i.lines.map(function(l){ return '<tr><td><b>'+esc(l.item||'')+'</b>'+(l.description&&l.description!==l.item?'<div style="color:var(--muted);font-size:12.5px">'+esc(l.description)+'</div>':'')+'</td><td style="text-align:right">'+(l.qty!=null?Number(l.qty).toLocaleString('en-US'):'')+'</td><td style="text-align:right">'+(l.rate!=null?money(l.rate):'')+'</td><td style="text-align:right">'+money(l.amount)+'</td></tr>'; }).join('')
      +'</tbody></table></div>'
      +'<div class="tot"><span>Total</span><span>'+money(i.total)+'</span></div>'
      +'<div class="tot" style="color:'+(i.balance>0.004?'var(--err)':'var(--ok)')+'"><span>Balance due</span><span>'+money(i.balance)+'</span></div>'
      +(i.memo?'<p class="meta" style="margin-top:12px">'+esc(i.memo)+'</p>':'')
      +'<div class="actions"><a class="btn" href="'+pdf+'" target="_blank" rel="noopener" style="text-decoration:none;background:var(--brand);border-color:var(--brand);color:#fff">Download PDF</a><button class="btn" id="bClose">Close</button></div>';
    $('bClose').addEventListener('click',closeSheet);
  }catch(e){ if(e.message!=='signed-out') body.innerHTML='<div class="empty">'+esc(e.message)+'</div><div class="actions"><button class="btn" id="bClose">Close</button></div>'; var c=$('bClose'); if(c) c.addEventListener('click',closeSheet); }
}
function closeSheet(){ $('sheet').classList.add('hidden'); }
$('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) closeSheet(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

// ---- Install as an app (Nov 2026) ----------------------------------------
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/portal/sw.js',{scope:'/portal/'}).catch(function(){}); }
var _installEvt=null;
function _isInstalled(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
function _isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function _dismissed(){ try{ return Number(localStorage.getItem('portal_install_dismissed')||0) > Date.now()-30*86400000; }catch(e){ return false; } }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); _installEvt=e; showInstallBar(); });
window.addEventListener('appinstalled',function(){ var b=document.getElementById('installBar'); if(b) b.classList.add('hidden'); });
function showInstallBar(){
  var b=document.getElementById('installBar'); if(!b || _isInstalled() || _dismissed() || document.getElementById('app').classList.contains('hidden')) return;
  var how='';
  if(_installEvt) how='<button class="btn" id="bInstall" style="height:38px;background:var(--brand);border-color:var(--brand);color:#fff">Install</button>';
  else if(_isIOS()) how='';
  else return;
  b.innerHTML='<img src="/portal/icon-192.png" alt=""><div class="t"><b>Get the Leader Meat app</b>'
    +(_installEvt?'One tap — your account on your home screen.':'Tap <b style="display:inline">Share</b> <span aria-hidden="true">⎙</span>, then <b style="display:inline">Add to Home Screen</b>.')+'</div>'
    +how+'<button class="x" id="bInstallX" aria-label="Dismiss">×</button>';
  b.classList.remove('hidden');
  var i=document.getElementById('bInstall'); if(i) i.onclick=async function(){ _installEvt.prompt(); try{ await _installEvt.userChoice; }catch(e){} _installEvt=null; b.classList.add('hidden'); };
  document.getElementById('bInstallX').onclick=function(){ try{ localStorage.setItem('portal_install_dismissed',String(Date.now())); }catch(e){} b.classList.add('hidden'); };
}
start().then(showInstallBar).catch(function(e){ if(e.message!=='signed-out') showLogin(); });
})();
</script>
</body>
</html>
