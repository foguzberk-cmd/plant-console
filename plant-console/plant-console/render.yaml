services:
  - type: web
    name: plant-console-app
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    branch: main
    rootDir: plant-console/plant-console
    # Persistent disk: without this, DATA_DIR falls back to a folder inside
    # the app directory, which is wiped on every deploy/restart — taking the
    # shared items/transactions/users data AND the QuickBooks connection
    # tokens with it. NOTE: persistent disks require a paid Render instance
    # type (not available on the free tier). If you're on the free tier,
    # either upgrade the service plan or accept that data/tokens reset on
    # every deploy until you do.
    disk:
      name: plant-console-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: QB_REALM
        sync: false
      - key: QB_CLIENT_ID
        sync: false
      - key: QB_CLIENT_SECRET
        sync: false
      - key: QB_ACCESS_TOKEN
        sync: false
      - key: QB_REFRESH_TOKEN
        sync: false
      - key: QB_REDIRECT_URI
        value: https://plant-console-app.onrender.com/callback
      # From the Intuit Developer Portal -> your app -> Webhooks page (a
      # separate secret from CLIENT_ID/CLIENT_SECRET). Required for
      # /api/qb-webhook to verify that incoming requests genuinely came
      # from Intuit. The rest of the app works fine without this set —
      # only real-time Customer/Vendor webhook updates need it.
      - key: QB_WEBHOOK_VERIFIER_TOKEN
        sync: false
      # Free Geoapify API key (no credit card, 3,000 credits/day) — powers
      # the driver route-mileage estimate (/api/data/driver-route-miles),
      # using Geoapify's truck-mode routing so estimates account for real
      # truck road restrictions (like NJ parkway bans) instead of Google's
      # all-or-nothing "avoid every highway" toggle. Entirely optional:
      # everything else in the app works fine without this set, that one
      # feature just returns a clear "no API key configured" error until
      # it is. Get a key at myprojects.geoapify.com (free, no card).
      - key: GEOAPIFY_API_KEY
        sync: false
      # Optional second key that adds a "regular route" comparison number
      # next to the truck-route mileage above — a normal car/passenger
      # route via Google's Directions API, free to use parkways/highways
      # a commercial truck legally can't, so the gap between the two
      # numbers shows the extra distance the truck restriction actually
      # costs. Unlike Geoapify, Google requires a Cloud project with
      # billing enabled (Directions API turned on) — no free/card-free
      # tier. Entirely optional: everything else, including the truck
      # mileage above, works fine without this set; only the "regular
      # route" comparison number is disabled until it is.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
